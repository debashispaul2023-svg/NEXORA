<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>NEXORA — Research Terminal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <img src="/branding/nexora-bot.png" alt="NEXORA" class="brand-img" />
        <div>
          <div class="brand-name">NEXORA</div>
          <div class="brand-tag">Research · Paper · AI</div>
        </div>
      </div>
      <div class="mode-chip" aria-label="Trading mode">Paper Mode</div>
      <p class="nav-label">Workspace</p>
      <nav class="nav" id="nav">
        <a href="#overview" data-page="overview"><span class="ico" aria-hidden="true">◉</span> Overview</a>
        <a href="#market" data-page="market"><span class="ico" aria-hidden="true">◈</span> Market Data</a>
        <a href="#experiments" data-page="experiments"><span class="ico" aria-hidden="true">▣</span> Experiments</a>
        <a href="#ai" data-page="ai"><span class="ico" aria-hidden="true">✦</span> AI Learning</a>
        <a href="#proposals" data-page="proposals"><span class="ico" aria-hidden="true">◎</span> Proposals</a>
        <a href="#paper" data-page="paper"><span class="ico" aria-hidden="true">◇</span> Risk & Paper</a>
        <a href="#loop" data-page="loop"><span class="ico" aria-hidden="true">↻</span> Learning Loop</a>
      </nav>
      <div class="sidebar-foot">
        Local only · 127.0.0.1<br />
        Paper trading only · No live orders<br />
        No authentication
      </div>
    </aside>
    <button class="overlay" id="overlay" aria-label="Close menu" tabindex="-1"></button>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰ Menu</button>
        <div class="title-block">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub" class="page-sub">Paper research terminal</p>
        </div>
        <div class="status-pill" id="livePill">Paper Mode</div>
      </header>
      <section id="content" class="content" aria-live="polite">
        <div class="skeleton-grid" aria-busy="true">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
