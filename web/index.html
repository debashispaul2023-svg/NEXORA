<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>NEXORA — Research Terminal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <img src="/branding/nexora-bot.png" alt="NEXORA" class="brand-img" />
        <div>
          <div class="brand-name">NEXORA</div>
          <div class="brand-tag">Research · Paper · AI</div>
        </div>
      </div>
      <p class="nav-label">Research</p>
      <nav class="nav" id="nav">
        <a href="#overview" data-page="overview">Overview</a>
        <a href="#market" data-page="market">Market Data</a>
        <a href="#experiments" data-page="experiments">Experiments</a>
        <a href="#ai" data-page="ai">AI Learning</a>
        <a href="#proposals" data-page="proposals">Proposals</a>
        <a href="#paper" data-page="paper">Risk & Paper</a>
        <a href="#loop" data-page="loop">Learning Loop</a>
      </nav>
      <div class="sidebar-foot">Local server only<br />No live orders · No auth</div>
    </aside>
    <button class="overlay" id="overlay" aria-label="Close menu"></button>
    <div class="workspace">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">Menu</button>
        <div class="title-block">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub" class="page-sub">Paper research terminal</p>
        </div>
        <input id="pageFilter" class="page-filter" type="search" placeholder="Filter this page" aria-label="Filter this page" />
        <div class="status-pill" id="livePill">PAPER MODE</div>
      </header>
      <div id="connection" class="connection" hidden></div>
      <section id="content" class="content" aria-live="polite">
        <div class="skeleton-grid" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
